# SPDX-License-Identifier: Apache-2.0
# Workspace member. This directory holds the `planlabel-mcp` distribution; the
# importable package is planlabel_mcp/planlabel_mcp/.
#
# The one level of nesting is forced, not stylistic: hatchling refuses a dev-mode
# install when a project directory doubles as its own package directory
# ("path rewrite in the sources option changes a prefix rather than removes it"),
# and a package outside its distribution's project directory cannot produce a
# self-contained PEP 517 sdist. README.md and LICENSE are real copies here for the
# same reason -- an sdist cannot reference files above its own root.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "planlabel-mcp"
dynamic = ["version"]
description = "MCP server exposing PlanLabel-labelled construction drawings to MCP hosts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The PlanLabel Authors" }]
keywords = ["mcp", "pdf", "ifc", "bim", "aec", "construction", "drawings"]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "planlabel>=0.1.0.dev0,<0.2",
  "mcp>=1.3",  # MIT; permissive transitives only
]

[project.scripts]
planlabel-mcp = "planlabel_mcp.server:main"

[project.urls]
Homepage = "https://srtgn.github.io/planlabel/"
Documentation = "https://srtgn.github.io/planlabel/"
Specification = "https://srtgn.github.io/planlabel/spec/0.1"
Source = "https://github.com/srtgn/planlabel"
Issues = "https://github.com/srtgn/planlabel/issues"

[tool.hatch.version]
path = "planlabel_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["planlabel_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/planlabel_mcp", "/README.md", "/LICENSE"]

# Resolve the sibling core distribution from the workspace during development
# rather than from PyPI.
[tool.uv.sources]
planlabel = { workspace = true }
