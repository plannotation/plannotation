# SPDX-License-Identifier: Apache-2.0
#
# Plannotation continuous integration.
#
# Installs every extra, builds the reference samples, then runs exactly the
# `make check` a developer runs locally:
#   ruff format --check  ->  ruff check  ->  mypy --strict  ->  pytest -q
# Nothing is duplicated here, so the two cannot drift apart. A second job draws the
# real example sheets on Linux, as the Pages build does, and validates each against
# the model it was drawn from (`make examples-check`).
#
# No secrets are used and none are needed.
#
# External CLIs are deliberately NOT installed. veraPDF, Inkscape and
# tesseract/ocrmypdf are GPL tools that Plannotation only ever shells out to when
# they happen to be on PATH. Every test that can use one must probe PATH and skip
# when it is absent. CI is the reference environment in which they are absent,
# which is what keeps that rule honest.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a pull request are cancelled. Pushes to main always run
  # to completion, so every commit on main gets its own green or red result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Report every cell; a macOS-only wheel problem must not be hidden by
      # an unrelated Linux failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Both runners are load-bearing: pikepdf and ifcopenshell
        # publish a separate binary wheel per Python-minor x platform, so each
        # cell installs different compiled code.
        #
        # Do NOT downgrade these images. ifcopenshell's Linux wheels are
        # manylinux_2_31, so ubuntu-20.04 and any musl/Alpine container cannot
        # resolve them; pikepdf 10.x arm64 wheels are tagged macosx_14_0, so a
        # pre-14 macOS runner silently backtracks to pikepdf 8.

    env:
      # The repository commits .python-version (3.12) so contributors get a
      # pinned interpreter. UV_PYTHON takes precedence over that file, so setting
      # it here is what keeps the matrix authoritative instead of every cell
      # silently testing 3.12. setup-uv also sets it from python-version below;
      # this is the explicit, load-bearing statement of intent.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Do not leave the job token in .git/config; nothing here pushes.
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        # setup-uv deliberately stopped publishing major and minor tags at v8, so
        # there is no @v10 to track. v10.1.0 is an immutable release tag, which
        # means it does NOT float onto security fixes -- bump it deliberately, or
        # let Dependabot do it. To pin by digest instead, swap in:
        #   astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # uv downloads the interpreter itself, so no setup-python step is needed.
          python-version: ${{ matrix.python-version }}
          # Create and PATH-activate .venv up front, so make recipes work whether
          # they say `uv run ruff` or bare `ruff`.
          activate-environment: true
          enable-cache: true
          # The cache key already includes arch, OS and Python version, so the
          # no two cells share an entry. Narrowing the dependency part to the
          # lockfile means pyproject.toml edits that do not change resolution
          # keep the cache warm.
          cache-dependency-glob: uv.lock
          # `version` is intentionally unset: setup-uv reads it from
          # [tool.uv] required-version in pyproject.toml, so dev and CI are
          # pinned to one uv range from a single place.

      - name: Install libcairo (Linux)
        # `make samples` imports cairosvg, a cffi binding to a SYSTEM libcairo that
        # no wheel can ship.
        if: runner.os == 'Linux'
        run: |
          if ! ldconfig -p 2>/dev/null | grep -q 'libcairo\.so\.2'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libcairo2
          fi

      - name: Install libcairo (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list --formula cairo >/dev/null 2>&1 || brew install cairo
          # ctypes.util.find_library() does not search /opt/homebrew/lib on Apple
          # silicon, so cairocffi cannot load libcairo.2.dylib without this.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}" >> "$GITHUB_ENV"

      - name: Install the locked dependencies
        # --locked fails instead of silently relocking, so a stale uv.lock is a
        # CI error rather than a surprise. --all-packages covers both workspace
        # members, --all-extras the exporter, the SVG reader and the benchmark.
        run: uv sync --locked --all-packages --all-extras --dev

      - name: Build the reference samples
        # The MCP, inspector and inference tests read these; without them they skip.
        run: make samples

      - name: make check
        run: make check

      - name: The CLI reports its version
        run: uv run --no-sync plannotation --version

      - name: Licence policy holds
        # The hardest constraint in the project: no AGPL, no PyMuPDF, and no
        # unacknowledged copyleft anywhere in the installed closure.
        run: uv run --no-sync python tools/audit_licenses.py

  examples:
    # Linux has no Helvetica, which the sheets are set in, so tools/linux_fonts.sh
    # pins its metric twin before anything is drawn. The sheets are uploaded so that
    # they can be compared with a build made elsewhere.
    name: examples / ubuntu-latest / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install libcairo, and set Helvetica as Liberation Sans
        run: |
          if ! ldconfig -p 2>/dev/null | grep -q 'libcairo\.so\.2'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libcairo2
          fi
          sh tools/linux_fonts.sh

      - name: Restore the pinned models
        # The model is served from Git LFS, billed to buildingSMART, so it is fetched
        # once and then cached. The key follows the file that pins it; an older entry
        # is fine to restore, because fetch() downloads again any file whose size or
        # SHA-256 is not the pinned one.
        uses: actions/cache@v6
        with:
          path: .cache/examples
          key: examples-${{ hashFiles('plannotation/export/examples.py') }}
          restore-keys: examples-

      - name: Install the locked dependencies
        run: uv sync --locked --all-packages --all-extras --dev

      - name: Build the example sheets and validate each against its model
        run: make examples-check

      - name: Pin what the real sheets describe
        # These tests skip unless the pinned model is cached, which it now is.
        env:
          PLANNOTATION_EXAMPLES_CACHE: .cache/examples
        run: uv run --no-sync pytest -q tests/test_examples_real.py

      - name: Build the site with the sheets, as Pages builds it
        # Stages everything with the examples, checks every link, and renders the
        # Markdown; the site itself is not kept.
        run: make site

      - name: Upload the sheets
        # Also when the check fails: the sheets are what to look at then.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-linux
          path: examples/
          retention-days: 14
