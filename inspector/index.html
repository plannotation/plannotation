<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plannotation inspector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='3'%20y='6'%20width='26'%20height='20'%20rx='2'%20fill='%23fff'%20stroke='%231b1b19'%20stroke-width='2'/%3E%3Crect%20x='8'%20y='11'%20width='10'%20height='10'%20fill='none'%20stroke='%231d6fa5'%20stroke-width='2.5'/%3E%3Cpath%20d='M21%2021h4'%20stroke='%239a5b00'%20stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #d8d8d2; --accent: #1d6fa5; --warn: #9a5b00;
    /* The overlay's colours. The page is white paper in either theme, so they stay. */
    --element: #1d6fa5; --annotation: #9a5b00; --viewport: #3f7d3f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #1f1f23; --ink: #e8e8e4; --muted: #9a9a94;
      --line: #34343a; --accent: #6ab7e8; --warn: #e0a24a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --panel: #1f1f23; --ink: #e8e8e4; --muted: #9a9a94;
    --line: #34343a; --accent: #6ab7e8; --warn: #e0a24a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a[href] { color: var(--accent); }
  h1 a[href]:hover { text-decoration: underline; }
  .pages { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
  @media (max-width: 640px) { header { position: static; gap: 8px; padding: 10px 16px; } }
  .muted { color: var(--muted); }
  button, select, label.file {
    font: inherit; padding: 5px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button:hover, label.file:hover { border-color: var(--accent); }
  input[type=file] { display: none; }
  select#example { max-width: 100%; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  /* The stage takes the free width, so "fit" can measure it; the canvas never sets it. */
  #stage { position: relative; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; line-height: 0; overflow: auto; flex: 1 1 640px; min-width: 0; }
  #paper, #overlay { display: block; }
  #overlay { position: absolute; top: 0; left: 0; touch-action: pan-x pan-y pinch-zoom; }
  #note { line-height: 1.5; margin: 0; padding: 48px 20px; text-align: center; color: var(--muted); }
  #note:empty { display: none; }
  aside { flex: 0 1 360px; min-width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles label { display: inline-flex; gap: 5px; align-items: center;
                   border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .toggles input { margin: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #tip { position: fixed; pointer-events: none; z-index: 9; max-width: 320px; display: none;
         background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1><a id="home">Plannotation</a> inspector</h1>
  <select id="example" aria-label="Example drawing" hidden></select>
  <label class="file">Open PDF<input type="file" id="file" accept="application/pdf"></label>
  <span class="pages"><button id="prev" aria-label="Previous page">&larr;</button>
  <span id="pager" class="muted">no document</span>
  <button id="next" aria-label="Next page">&rarr;</button></span>
  <select id="zoom" aria-label="Zoom">
    <option value="fit" selected>fit</option><option value="1">100%</option>
    <option value="2">200%</option><option value="4">400%</option>
  </select>
  <button id="copy">Copy JSON</button>
  <button id="csv">Export CSV</button>
</header>

<main>
  <div id="stage">
    <p id="note">Open a plannotated PDF. Nothing is uploaded.</p>
    <canvas id="paper" width="0" height="0"></canvas>
    <canvas id="overlay" width="0" height="0"></canvas>
  </div>
  <aside>
    <div class="card">
      <h2>Sheet</h2>
      <dl id="sheet"><dd class="muted" style="grid-column:1/-1">nothing yet</dd></dl>
    </div>
    <div class="card">
      <h2>Show</h2>
      <div class="toggles" id="toggles"></div>
      <div class="toggles" id="types" title="Annotation types on this page"></div>
    </div>
    <div class="card">
      <h2>On this page</h2>
      <table><thead><tr><th>id</th><th>what</th><th>provenance</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="empty">nothing yet</td></tr></tbody></table>
    </div>
  </aside>
</main>
<div id="tip"></div>

<script type="module">
// pdf.js is loaded from a CDN on first use and then works from disk. The inspector is
// one file on purpose: a drawing office can keep it next to the drawings.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
const WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

const el = (id) => document.getElementById(id);
const state = { doc: null, page: 1, plannotations: new Map(), scale: "fit", hit: [], selected: null,
                pdf: null, size: null, task: null, ticket: 0, opening: 0, fitWidth: 0 };
const KINDS = [
  ["element", "elements", "--element"],
  ["annotation", "annotations", "--annotation"],
  ["viewport", "viewports", "--viewport"],
];
const shown = new Set(KINDS.map(([k]) => k));
// Per annotation type -- grid, dimension, level, tag, callout -- built from the page's
// own plannotation, since a section has levels and a plan does not.
const hiddenTypes = new Set();

function typeToggles(plannotation) {
  const types = [...new Set((plannotation?.annotations || []).map((a) => a.type))].sort();
  const box = el("types");
  box.innerHTML = "";
  for (const type of types) {
    const wrap = document.createElement("label");
    wrap.innerHTML = `<input type="checkbox" ${hiddenTypes.has(type) ? "" : "checked"}
      data-type="${escape(type)}">${escape(type)}`;
    wrap.querySelector("input").addEventListener("change", (e) => {
      e.target.checked ? hiddenTypes.delete(type) : hiddenTypes.add(type);
      draw();
    });
    box.append(wrap);
  }
}

for (const [kind, label, varName] of KINDS) {
  const wrap = document.createElement("label");
  wrap.innerHTML = `<input type="checkbox" checked data-kind="${kind}">
    <span class="swatch" style="background:var(${varName})"></span>${label}`;
  wrap.querySelector("input").addEventListener("change", (e) => {
    e.target.checked ? shown.add(kind) : shown.delete(kind);
    draw();
  });
  el("toggles").append(wrap);
}

let pdfjs = null;
async function library() {
  if (!pdfjs) {
    pdfjs = await import(PDFJS);
    pdfjs.GlobalWorkerOptions.workerSrc = WORKER;
  }
  return pdfjs;
}

// Opens a document from bytes ({ data }) or from this site ({ url }). A failure clears
// the stage and says why, instead of leaving the last drawing up under a new name.
async function open(source, name, page = 1) {
  const opening = ++state.opening;
  el("note").textContent = "";
  el("pager").textContent = `opening ${name}`;
  try {
    const lib = await library();
    const doc = await lib.getDocument({ ...source, isEvalSupported: false }).promise;
    const plannotations = await readPlannotations(doc);
    if (opening !== state.opening) { doc.destroy(); return; } // a later choice has taken over
    state.doc?.destroy();
    state.doc = doc;
    state.plannotations = plannotations;
    state.page = Math.min(Math.max(1, page), doc.numPages);
    state.selected = null;
    await render();
  } catch (error) {
    if (opening !== state.opening) return;
    state.doc?.destroy();
    state.doc = null;
    state.plannotations = new Map();
    for (const canvas of [el("paper"), el("overlay")]) canvas.width = canvas.height = 0;
    el("pager").textContent = "no document";
    el("note").textContent = `Could not open ${name}: ${error.message}`;
    describe();
  }
}

el("file").addEventListener("change", async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  state.pdf = null;
  remember();
  el("example").value = "";
  await open({ data: new Uint8Array(await file.arrayBuffer()) }, file.name);
});

// A link can name a drawing on this site: ?pdf=<url relative to this page>&page=<n>.
// Only same-site URLs open this way, so nobody can show a stranger's PDF under this
// site's name. A site that also serves ../examples/index.json gets a picker of them;
// a copy kept next to the drawings has neither and works as before.
const EXAMPLES = "../examples/";

async function examples() {
  try {
    const response = await fetch(`${EXAMPLES}index.json`);
    return response.ok ? (await response.json()).examples || [] : [];
  } catch {
    return [];
  }
}

async function openLink(value, page = 1) {
  state.pdf = value;
  let url = null;
  try { url = new URL(value, location.href); } catch { /* not a URL at all */ }
  if (url?.origin !== location.origin) {
    el("note").textContent = `Not opened: ${value} is not on this site.`;
    return;
  }
  await open({ url: url.href }, value.split("/").pop(), page);
  remember();
}

function remember() {
  const query = state.pdf == null ? "" :
    `?pdf=${encodeURIComponent(state.pdf).replace(/%2F/g, "/")}` +
    (state.page > 1 ? `&page=${state.page}` : "");
  history.replaceState(null, "", location.pathname + query);
}

el("example").onchange = (event) => openLink(event.target.value);

// A plannotation travels as an attachment named plannotation-pNNNN.json. pdf.js exposes
// the EmbeddedFiles name tree through getAttachments(), which is why Plannotation
// registers every file there as well as on the page's /AF.
async function readPlannotations(doc) {
  const found = new Map();
  const attachments = (await doc.getAttachments()) || {};
  for (const [name, entry] of Object.entries(attachments)) {
    const match = /^plannotation-p([0-9]{4}|[1-9][0-9]{4,})\.json$/.exec(name);
    if (!match) continue;
    try {
      found.set(Number(match[1]) + 1, JSON.parse(new TextDecoder().decode(entry.content)));
    } catch { /* a plannotation that will not parse is a plannotation that is absent */ }
  }
  return found;
}

el("prev").onclick = () => { if (state.page > 1) { state.page--; render(); remember(); } };
el("next").onclick = () => {
  if (state.doc && state.page < state.doc.numPages) { state.page++; render(); remember(); }
};
el("zoom").onchange = (e) => {
  state.scale = e.target.value === "fit" ? "fit" : Number(e.target.value);
  render();
};
// The stage's width changes with the window, and when a scrollbar comes or goes.
let resizing = null;
new ResizeObserver(() => {
  if (state.scale !== "fit" || el("stage").clientWidth === state.fitWidth) return;
  clearTimeout(resizing);
  resizing = setTimeout(render, 100);
}).observe(el("stage"));

async function render() {
  if (!state.doc) return;
  const ticket = ++state.ticket;
  const page = await state.doc.getPage(state.page);
  if (ticket !== state.ticket) return; // a later page or zoom has taken over
  state.fitWidth = el("stage").clientWidth;
  const scale = state.scale === "fit"
    ? Math.max(0.1, (state.fitWidth - 2) / page.getViewport({ scale: 1 }).width)
    : state.scale;
  const viewport = page.getViewport({ scale });
  // Sharp on high-density screens, but never more canvas than a phone will allocate.
  const ratio = Math.min(devicePixelRatio || 1,
    Math.sqrt(16e6 / (viewport.width * viewport.height)));
  state.task?.cancel();
  state.size = { width: viewport.width, height: viewport.height, ratio };
  for (const canvas of [el("paper"), el("overlay")]) {
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = `${viewport.width}px`; canvas.style.height = `${viewport.height}px`;
  }
  state.task = page.render({ canvasContext: el("paper").getContext("2d"),
                             viewport: page.getViewport({ scale: scale * ratio }) });
  try {
    await state.task.promise;
  } catch (error) {
    if (error?.name === "RenderingCancelledException") return;
    throw error;
  }
  el("pager").textContent = `page ${state.page} of ${state.doc.numPages}` +
    (state.plannotations.has(state.page) ? "" : " — no plannotation");
  describe();
  draw();
}

// Paper is millimetres, y up from the bottom left; a canvas is CSS pixels, y down from
// the top. One function does the flip, so nothing else has to remember it.
function toCanvas(x, y, plannotation, size) {
  const w = plannotation.page.widthMm, h = plannotation.page.heightMm;
  return [x / w * size.width, (h - y) / h * size.height];
}

function draw() {
  const canvas = el("overlay"), ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  state.hit = [];
  const plannotation = state.plannotations.get(state.page);
  if (!plannotation || !state.size) return;
  ctx.setTransform(state.size.ratio, 0, 0, state.size.ratio, 0, 0);
  const paint = (items, kind, colour) => {
    if (!shown.has(kind)) return;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue(colour).trim();
    for (const item of items || []) {
      if (kind === "annotation" && hiddenTypes.has(item.type)) continue;
      const box = item.paperBBox;
      if (!box) continue;
      const [x0, y0] = toCanvas(box[0], box[1], plannotation, state.size);
      const [x1, y1] = toCanvas(box[2], box[3], plannotation, state.size);
      const rect = [Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)];
      ctx.lineWidth = state.selected === item.id ? 2.5 : 1;
      ctx.setLineDash(kind === "viewport" ? [6, 4] : []);
      ctx.globalAlpha = state.selected && state.selected !== item.id ? 0.35 : 1;
      ctx.strokeRect(...rect);
      if (kind === "element" && item.paperOutlines) {
        for (const outline of item.paperOutlines) {
          ctx.beginPath();
          outline.forEach(([px, py], index) => {
            const [cx, cy] = toCanvas(px, py, plannotation, state.size);
            index ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy);
          });
          ctx.stroke();
        }
      }
      if (kind === "annotation" && item.geometry) {
        ctx.beginPath();
        item.geometry.forEach(([px, py], index) => {
          const [cx, cy] = toCanvas(px, py, plannotation, state.size);
          index ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy);
        });
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      state.hit.push({ rect, item, kind });
    }
  };
  paint(plannotation.viewports, "viewport", "--viewport");
  paint(plannotation.elements, "element", "--element");
  paint(plannotation.annotations, "annotation", "--annotation");
}

function describe() {
  const plannotation = state.plannotations.get(state.page);
  const sheet = el("sheet"), rows = el("rows");
  typeToggles(plannotation);
  if (!state.doc) {
    sheet.innerHTML = `<dd class="muted" style="grid-column:1/-1">nothing yet</dd>`;
    rows.innerHTML = `<tr><td colspan="3" class="empty">nothing yet</td></tr>`;
    return;
  }
  if (!plannotation) {
    sheet.innerHTML = `<dd class="muted" style="grid-column:1/-1">This page carries no plannotation.</dd>`;
    rows.innerHTML = `<tr><td colspan="3" class="empty">nothing to show</td></tr>`;
    return;
  }
  const level = conformance(plannotation);
  const pairs = [
    ["sheet", plannotation.sheet?.id], ["title", plannotation.sheet?.title],
    ["revision", plannotation.sheet?.revision],
    ["scale", plannotation.sheet?.scale ? `1:${plannotation.sheet.scale}` : null],
    ["type", plannotation.sheet?.drawingType], ["discipline", plannotation.sheet?.discipline],
    ["page", `${plannotation.page.widthMm} × ${plannotation.page.heightMm} mm`],
    ["provenance", plannotation.provenance], ["level", level],
    ["model", plannotation.model?.file], ["schema", plannotation.plannotation],
  ].filter(([, value]) => value != null && value !== "");
  sheet.innerHTML = pairs.map(([k, v]) => `<dt>${k}</dt><dd>${escape(String(v))}</dd>`).join("");

  const items = [
    ...(plannotation.viewports || []).map((i) => [i, "viewport", i.kind || "viewport"]),
    ...(plannotation.elements || []).map((i) => [i, "element", i.ifcClass + (i.tag ? ` · ${i.tag}` : "")]),
    ...(plannotation.annotations || []).map((i) => [i, "annotation", i.type + (i.text ? ` · ${i.text}` : "")]),
  ];
  rows.innerHTML = items.length
    ? items.map(([item, kind, what]) =>
        `<tr data-id="${escape(item.id)}"><td><code>${escape(item.id)}</code></td>` +
        `<td><span class="swatch" style="background:var(--${kind})"></span>${escape(what)}</td>` +
        `<td class="muted">${escape(item.provenance || plannotation.provenance)}` +
        `${item.confidence != null ? ` ${item.confidence}` : ""}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">nothing on this page</td></tr>`;
  for (const row of rows.querySelectorAll("tr[data-id]")) {
    row.onclick = () => {
      state.selected = state.selected === row.dataset.id ? null : row.dataset.id;
      for (const other of rows.querySelectorAll("tr")) other.classList.remove("on");
      if (state.selected) row.classList.add("on");
      draw();
    };
  }
}

// The levels of SPEC 4.1, computed here so the inspector can say what it is looking at
// without asking anything else.
function conformance(plannotation) {
  const linked = (a) => a.measures?.length || a.shows?.element || a.target?.sheetId ||
    a.target?.pdfPage != null || a.axis || a.ifcGuid;
  if (!plannotation.elements?.length) return "L1";
  return (plannotation.annotations || []).some(linked) ? "L3" : "L2";
}

const escape = (value) => String(value).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Pointer events, so that a tap on a phone shows what a hover shows on a desktop. A
// touch has no hover to end, so its tip stays until the next tap or scroll.
function tipAt(event) {
  const box = el("overlay").getBoundingClientRect();
  const x = event.clientX - box.left, y = event.clientY - box.top;
  const under = state.hit.filter(({ rect: [rx, ry, rw, rh] }) =>
    x >= rx && x <= rx + rw && y >= ry && y <= ry + rh);
  const tip = el("tip");
  if (!under.length) { tip.style.display = "none"; return; }
  // The smallest box is the most specific thing there: the wall, not the grid line
  // whose box runs the height of the sheet through it.
  const area = ({ rect }) => rect[2] * rect[3];
  const { item, kind } = under.reduce((best, hit) => (area(hit) < area(best) ? hit : best));
  const lines = [`<strong>${escape(item.id)}</strong> <span class="muted">${kind}</span>`];
  for (const key of ["ifcClass", "type", "kind", "name", "tag", "text", "axis", "value", "unit",
                     "ifcGuid", "provenance", "confidence", "elevation"]) {
    if (item[key] != null && item[key] !== "") lines.push(`${key}: ${escape(item[key])}`);
  }
  tip.innerHTML = lines.join("<br>");
  tip.style.display = "block";
  tip.style.left = `${Math.max(8, Math.min(event.clientX + 14, innerWidth - 340))}px`;
  const below = event.clientY + 14;
  tip.style.top = `${below + tip.offsetHeight > innerHeight
    ? Math.max(8, event.clientY - 14 - tip.offsetHeight) : below}px`;
}
const hideTip = () => { el("tip").style.display = "none"; };
el("overlay").addEventListener("pointermove", tipAt);
el("overlay").addEventListener("pointerdown", tipAt);
el("overlay").addEventListener("pointerleave", (event) => {
  if (event.pointerType === "mouse") hideTip();
});
document.addEventListener("pointerdown", (event) => {
  if (event.target !== el("overlay")) hideTip();
});
addEventListener("scroll", hideTip, { capture: true, passive: true });

el("copy").onclick = async () => {
  const plannotation = state.plannotations.get(state.page);
  if (!plannotation) return;
  await navigator.clipboard.writeText(JSON.stringify(plannotation, null, 2));
  el("copy").textContent = "Copied";
  setTimeout(() => (el("copy").textContent = "Copy JSON"), 1200);
};

el("csv").onclick = () => {
  const plannotation = state.plannotations.get(state.page);
  if (!plannotation) return;
  const cell = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const rows = [["kind", "id", "class_or_type", "name_or_text", "tag", "ifcGuid",
                 "provenance", "confidence", "x0", "y0", "x1", "y1"].join(",")];
  const add = (kind, items, classOf, nameOf) => {
    for (const item of items || []) {
      rows.push([kind, item.id, classOf(item), nameOf(item), item.tag, item.ifcGuid,
                 item.provenance ?? plannotation.provenance, item.confidence,
                 ...(item.paperBBox || ["", "", "", ""])].map(cell).join(","));
    }
  };
  add("viewport", plannotation.viewports, (i) => i.kind, (i) => i.name);
  add("element", plannotation.elements, (i) => i.ifcClass, (i) => i.name);
  add("annotation", plannotation.annotations, (i) => i.type, (i) => i.text);
  const url = URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" }));
  const link = Object.assign(document.createElement("a"),
    { href: url, download: `${plannotation.sheet?.id || "plannotation"}-page${state.page}.csv` });
  link.click();
  URL.revokeObjectURL(url);
};

// Last, so that everything above is defined before the first drawing opens.
const list = await examples();
if (list.length) {
  el("home").href = "../";
  el("example").innerHTML = list.map((entry) =>
    `<option value="${escape(EXAMPLES + entry.pdf)}">` +
    `${escape(`${entry.sheet ?? ""} ${entry.title ?? ""}`.trim())}</option>`).join("");
  el("example").hidden = false;
}
const linked = new URLSearchParams(location.search);
const first = linked.get("pdf") ?? (list.length ? EXAMPLES + list[0].pdf : null);
if (first != null) {
  const page = Number.parseInt(linked.get("page") ?? "", 10);
  el("example").value = first;
  openLink(first, page > 0 ? page : 1);
}
</script>
</body>
</html>
